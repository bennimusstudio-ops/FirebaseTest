<!DOCTYPE html>
<html>
<head>
  <title>Firebase Test</title>
</head>
<body>
  <h1>Firebase Test</h1>

  <button id="login">Sign in with Google</button>
  <button id="logout" hidden>Sign out</button>
  <p id="user">Not signed in</p>

  <h2>Taxon IDs</h2>
  <input id="taxon" type="number" placeholder="Taxon ID">
  <button id="addTaxon">Add</button>
  <ul id="taxonList"></ul>

  <h2>High Score</h2>
  <input id="score" type="number" min="0" placeholder="Score">
  <button id="saveScore">Save score</button>
  <p id="highScore">No score saved</p>

  <script type="module" src="./firebaseTest.js"></script>
</body>
</html>
